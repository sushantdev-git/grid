name: grid
description: "Grid: Decentralized Peer-to-Peer Mesh & Nostr Messenger"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  cryptography: ^2.7.0
  crypto: ^3.0.3
  web_socket_channel: ^3.0.1
  collection: ^1.18.0
  path_provider: ^2.1.6
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  path: ^1.9.1
  three_js: ^0.3.0
  record: ^5.2.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  stream_channel: ^2.1.2

dependency_overrides:
  record_platform_interface: 2.1.0
  record_linux: 2.1.1

flutter:
  uses-material-design: true
